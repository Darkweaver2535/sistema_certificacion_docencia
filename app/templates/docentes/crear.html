{% extends "base.html" %}

{% block title %}Nuevo Docente - EMI{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <!-- Header -->
            <div class="mb-4">
                <h2 style="color: var(--emi-azul-oscuro); font-weight: 700;">
                    <i class="bi bi-person-plus-fill"></i> Registrar Nuevo Docente
                </h2>
                <p class="text-muted mb-0">
                    <i class="bi bi-info-circle me-1"></i>
                    Ingrese el nombre completo del docente.
                </p>
            </div>

            <div class="card card-emi shadow">
                <div class="card-header" style="background: linear-gradient(135deg, var(--emi-azul-oscuro) 0%, var(--emi-azul) 100%); color: white; border: none;">
                    <h4 class="mb-0">
                        <i class="bi bi-clipboard-data-fill me-2"></i>Datos del Docente
                    </h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('docentes.crear') }}" class="form-emi">
                        <div class="mb-3">
                            <label for="nombres" class="form-label fw-bold">
                                <i class="bi bi-pencil-fill me-1" style="color: var(--emi-azul);"></i>
                                Nombres <span class="text-danger">*</span>
                            </label>
                            <input type="text" 
                                   class="form-control form-control-lg" 
                                   id="nombres" 
                                   name="nombres" 
                                   placeholder="Ingrese los nombres"
                                   required>
                        </div>
                        <div class="mb-4">
                            <label for="apellidos" class="form-label fw-bold">
                                <i class="bi bi-pencil-fill me-1" style="color: var(--emi-azul);"></i>
                                Apellidos <span class="text-danger">*</span>
                            </label>
                            <input type="text" 
                                   class="form-control form-control-lg" 
                                   id="apellidos" 
                                   name="apellidos" 
                                   placeholder="Ingrese los apellidos"
                                   required>
                        </div>

                        <!-- Botones de acción -->
                        <div class="d-flex justify-content-between align-items-center mt-4 pt-4" style="border-top: 2px solid #e9ecef;">
                            <a href="{{ url_for('docentes.listar') }}" class="btn btn-secondary btn-lg">
                                <i class="bi bi-x-circle me-2"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-emi-primary btn-lg">
                                <i class="bi bi-save-fill me-2"></i>Guardar Docente
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
